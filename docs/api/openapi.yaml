openapi: 3.0.3
info:
  title: Rewind API
  description: |
    REST API for Rewind — AI-powered mobile application for managing and extracting information from images.

    Status: Bootstrap initial contract.
    Only the health check endpoint is currently IMPLEMENTED. All other endpoints are PLANNED.
  version: 0.1.0
  contact:
    name: Rewind Team

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # =========================================================================
  # IMPLEMENTED ENDPOINTS
  # =========================================================================

  /api/v1/health:
    get:
      summary: Health check
      description: Returns service health status and timestamp. (IMPLEMENTED)
      operationId: getHealth
      tags:
        - Common
      responses:
        '200':
          description: Service is healthy and responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "UP"
                service: "rewind-backend"
                timestamp: "2026-11-07T12:00:00.000Z"

  /api/v1/media:
    get:
      summary: List user media items (IMPLEMENTED)
      description: Returns list of media items uploaded by the user with pre-signed view URLs.
      operationId: listMedia
      tags:
        - Media
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of media items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaResponse'
    post:
      summary: Upload new image (IMPLEMENTED)
      description: Uploads image file to Supabase private storage and creates a media record.
      operationId: uploadMedia
      tags:
        - Media
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload.
                width:
                  type: integer
                  description: Optional image width in pixels.
                height:
                  type: integer
                  description: Optional image height in pixels.
                capturedAt:
                  type: string
                  format: date-time
                  description: Optional timestamp of when the photo was taken.
      responses:
        '201':
          description: Image successfully uploaded and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'

  # =========================================================================
  # PLANNED ENDPOINTS (Not yet implemented)
  # =========================================================================

  /api/v1/auth/register:
    post:
      summary: Register new user (PLANNED)
      description: Creates a new user account.
      tags:
        - Auth (Planned)
      responses:
        '501':
          description: Not implemented yet

  /api/v1/auth/login:
    post:
      summary: User login (PLANNED)
      description: Authenticates user and returns JWT or session token.
      tags:
        - Auth (Planned)
      responses:
        '501':
          description: Not implemented yet

  /api/v1/auth/logout:
    post:
      summary: User logout (PLANNED)
      description: Invalidates current session or token.
      tags:
        - Auth (Planned)
      responses:
        '501':
          description: Not implemented yet

  /api/v1/users/me:
    get:
      summary: Get current user profile (PLANNED)
      description: Returns profile and settings of authenticated user.
      tags:
        - Users (Planned)
      responses:
        '501':
          description: Not implemented yet

  /api/v1/media/{id}:
    get:
      summary: Get media detail and extracted data (PLANNED)
      tags:
        - Media (Planned)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '501':
          description: Not implemented yet
    delete:
      summary: Delete media and associated extraction data (PLANNED)
      tags:
        - Media (Planned)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '501':
          description: Not implemented yet

  /api/v1/processing/{jobId}/status:
    get:
      summary: Check status of async image processing job (PLANNED)
      tags:
        - Processing (Planned)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '501':
          description: Not implemented yet

  /api/v1/search:
    get:
      summary: Search media by keyword or semantic query (PLANNED)
      tags:
        - Search (Planned)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '501':
          description: Not implemented yet

  /api/v1/tags:
    get:
      summary: List user tags (PLANNED)
      tags:
        - Tags (Planned)
      responses:
        '501':
          description: Not implemented yet

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          example: "UP"
        service:
          type: string
          example: "rewind-backend"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-07T12:00:00.000Z"

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Requested resource was not found."
        timestamp:
          type: string
          format: date-time
          example: "2026-11-07T12:00:00.000Z"
        details:
          type: object
          nullable: true

    MediaResponse:
      type: object
      required:
        - id
        - userId
        - storagePath
        - signedUrl
        - originalFilename
        - mimeType
        - fileSizeBytes
        - processingStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        storagePath:
          type: string
        signedUrl:
          type: string
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
        processingStatus:
          type: string
          enum: [UPLOADED, PROCESSING, COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
